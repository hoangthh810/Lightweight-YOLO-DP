  # YOLOv5 🚀 YOLOv5-DP-AD (Keep P5 Backbone, Detect P3-P4)

  # Parameters
  nc: 1
  depth_multiple: 0.33
  width_multiple: 0.50
  anchors:
    - [ 10,13, 16,30, 33,23 ]  # P3/8 (Vật thể nhỏ)
    - [ 30,61, 62,45, 59,119 ]  # P4/16 (Vật thể trung bình)

  # Backbone (Giữ nguyên cấu trúc mạnh mẽ của bạn)
  backbone:
    [ [ -1, 1, Conv, [ 64, 6, 2, 2 ] ],  # 0-P1/2
      [ -1, 1, Conv, [ 128, 3, 2 ] ],     # 1-P2/4
      [ -1, 1, GhostConv, [ 128 ] ],      # 2
      [ -1, 1, DSConv, [ 256, 3, 2, 16] ],     # 3-P3/8
      [ -1, 1, GhostConv, [ 256 ] ],      # 4
      [ -1, 1, DSConv, [ 512, 3, 2, 32] ],     # 5-P4/16
      [ -1, 1, GhostConv_LR, [ 512 ] ],      # 6
      [ -1, 1, DSConv, [ 1024, 3, 2, 64 ] ],    # 7-P5/32
      [ -1, 1, GhostConv_LR, [ 1024, 1, 1, 64 ] ],     # 8
      [ -1, 1, SPPF_LR, [ 1024, 5, 64 ] ],       # 9
    ]

  # Head (Chỉ tập trung vào P3 và P4)
  head:
    [ [ -1, 1, GhostConv_LR, [ 512, 1, 1, 32 ] ], # 10 (Từ SPPF đi xuống)
      [ -1, 1, nn.Upsample, [ None, 2, 'nearest' ] ], # 11
      [ [ -1, 6 ], 1, Concat, [ 1 ] ],       # 12 Cat với P4 backbone
      [ -1, 3, C2f_LR, [ 512, False, 32 ] ],      # 13 (Output P4 dự phòng)

      [ -1, 1, GhostConv_LR, [ 256, 1, 1, 16 ] ], # 14
      [ -1, 1, nn.Upsample, [ None, 2, 'nearest' ] ], # 15
      [ [ -1, 4 ], 1, Concat, [ 1 ] ],       # 16 Cat với P3 backbone
      [ -1, 3, C2f_LR, [ 256, False, 16 ] ],      # 17 (Output P3 - Chính)

      [ -1, 1, GhostConv, [ 256, 3, 2] ], # 18 Quay lại P4
      [ [ -1, 14 ], 1, Concat, [ 1 ] ],      # 19 Kết nối ngang trong Neck
      [ -1, 3, C2f_LR, [ 512, False, 32 ] ],      # 20 (Output P4 - Chính)

      # Detect chỉ lấy đầu ra từ P3 (layer 17) và P4 (layer 20)
      [ [ 17, 20 ], 1, Detect, [ nc, anchors ] ],  # Detect(P3, P4)
    ]