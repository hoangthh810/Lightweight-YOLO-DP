# YOLOv5 🚀 Enhanced-YOLOvDP (Tối ưu hóa từ bản gốc yolov5-DP.yaml)

# Parameters
nc: 1  # số lượng lớp (unhealthy tree)
depth_multiple: 0.33
width_multiple: 0.50
anchors:
  # Loại bỏ anchors của P3, chỉ giữ lại cho P4 và P5
  - [30,61, 62,45, 59,119]      # P4/16
  - [116,90, 156,198, 373,326]  # P5/32

# Enhanced-YOLOvDP backbone
backbone:
  # Thay thế toàn bộ LSKmodule bằng khối C3 nguyên bản
  [[-1, 1, Conv, [64, 6, 2, 2]],  # 0-P1/2
   [-1, 1, Conv, [128, 3, 2]],     # 1-P2/4
   [-1, 3, C3, [128]],             # 2-Thay LSK bằng C3
   [-1, 1, Conv, [256, 3, 2]],     # 3-P3/8
   [-1, 6, C3, [256]],             # 4-Thay LSK bằng C3
   [-1, 1, Conv, [512, 3, 2]],     # 5-P4/16
   [-1, 9, C3, [512]],             # 6-Thay LSK bằng C3
   [-1, 1, Conv, [1024, 3, 2]],    # 7-P5/32
   [-1, 3, C3, [1024]],            # 8-Thay LSK bằng C3
   [-1, 1, SPPF, [1024, 5]],       # 9
  ]

# Enhanced-YOLOvDP head (Đã lược bỏ nhánh P3)
head:
  [[-1, 1, GhostConv, [512, 1, 1]],
   [-1, 1, nn.Upsample, [None, 2, 'nearest']],
   [[-1, 6], 1, Concat, [1]],       # Kết nối với P4 của backbone
   [-1, 3, C3, [512, False]],       # 13 - Output cho P4

   # Nhánh P3 cũ đã được lược bỏ hoàn toàn ở đây để tăng tốc

   [-1, 1, GhostConv, [512, 3, 2]],
   [[-1, 10], 1, Concat, [1]],      # Kết nối ngược lại với đầu vào neck
   [-1, 3, C3, [1024, False]],      # 16 - Output cho P5

   # Đầu ra Detect chỉ nhận 2 quy mô: P4 và P5
   [[13, 16], 1, Detect, [nc, anchors]],
  ]