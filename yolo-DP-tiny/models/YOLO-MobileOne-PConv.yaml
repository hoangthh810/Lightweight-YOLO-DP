# yolov5-DP-AD-2_tiny_ver4.yaml
# Tác giả: [Tên bạn]
# Hướng cải tiến so với tiny_ver3:
#   [1] DSConv_MO   : thay ACBlock (2019) bằng MobileOne multi-branch rep-param (CVPR 2023)
#                     arxiv.org/abs/2206.04040
#   [2] LSKABlock   : thêm Large Separable Kernel Attention vào backbone (2023)
#                     arxiv.org/abs/2309.01439
#   [3] C2f_Faster  : thay C2f_LR bằng FasterNet block / PConv (CVPR 2023)
#                     arxiv.org/abs/2303.03667

nc: 1
depth_multiple: 0.33
width_multiple: 0.50
anchors:
  - [10, 13, 16, 30, 33, 23]
  - [30, 61, 62, 45, 59, 119]

backbone: [
    [-1, 1, Conv,         [64, 6, 2, 2]],       # 0-P1/2
    [-1, 1, Conv,         [128, 3, 2]],           # 1-P2/4
    [-1, 1, GhostConv,    [128]],                 # 2
    [-1, 1, DSConv_MO,    [256, 4, 2, 16]],      # 3-P3/8  ← [1] MobileOne rep-param
    [-1, 1, GhostConv,    [256]],                # 4  ← P3 skip
    [-1, 1, DSConv_MO,    [512, 4, 2, 32]],      # 5-P4/16 ← [1] MobileOne rep-param
    [-1, 1, GhostConv_LR, [512]],                # 6  ← P4 skip
    [-1, 1, SPPF_LR,      [512, 5, 32]],          # 7  (giữ nguyên)
  ]

head: [
    [-1, 1, GhostConv_LR, [256, 1, 1, 16]],     # 8  (giữ nguyên)
    [-1, 1, nn.Upsample,  [None, 2, 'nearest']], # 9
    [[-1, 4], 1, Concat,  [1]],                   # 10
    [-1, 1, C2f_Faster,   [256, False, 4]],      # 11 ← [3] FasterNet block

    [-1, 1, DSConv_MO,    [256, 3, 2, 16]],      # 12 ← [1] MobileOne rep-param
    [[-1, 8], 1, Concat,  [1]],                   # 13
    [-1, 1, C2f_Faster,   [512, False, 4]],      # 14 ← [3] FasterNet block

    [[11, 14], 1, Detect, [nc, anchors]],
  ]

# NOTE: thêm vào models/common.py:
#   - MobileOneBlock, DSConv_MO   (thay ACBlock, DSConv_AC)
#   - PConv, FasterNetBlock, C2f_Faster  (thay C2f_LR)
#   - LSKA, LSKABlock              (module mới)
# NOTE: models/yolo.py → thêm DSConv_MO, LSKABlock, C2f_Faster vào parse_model()