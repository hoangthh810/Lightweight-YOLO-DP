nc: 1
depth_multiple: 0.33
width_multiple: 0.50
anchors:
  - [10, 13, 16, 30, 33, 23] # P3/8
  - [30, 61, 62, 45, 59, 119] # P4/16

backbone: [
    [-1, 1, Conv, [64, 6, 2, 2]], # 0-P1/2
    [-1, 1, Conv, [128, 3, 2]], # 1-P2/4
    [-1, 1, GhostConv, [128]], # 2
    [-1, 1, DSConv, [256, 3, 2, 16]], # 3-P3/8
    [-1, 1, GhostConv, [256]], # 4  ← P3 skip
    [-1, 1, DSConv, [512, 3, 2, 32]], # 5-P4/16
    [-1, 1, GhostConv_LR, [512]], # 6  ← P4 skip
    [-1, 1, SPPF_LR, [512, 5, 32]], # 7  ← SPPF tại P4 (r=32, giảm từ 64)
  ] # Đã xoá layers P5 (DSConv+GhostConv_LR+SPPF cũ)

head: [
    [-1, 1, GhostConv_LR, [256, 1, 1, 16]], # 8  (SPPF→128ch, r=16 thay vì 32)
    [-1, 1, nn.Upsample, [None, 2, "nearest"]], # 9
    [[-1, 4], 1, Concat, [1]], # 10 Cat P3 backbone (128+128=256ch)
    [-1, 1, C2f_LR, [256, False, 16]], # 11 P3 feature → 128ch

    [-1, 1, DSConv, [256, 3, 2, 16]], # 12 ← DSConv thay GhostConv (128→128, ~5.8k params)
    [[-1, 8], 1, Concat, [1]], # 13 Cat với neck P4 (128+128=256ch)
    [-1, 1, C2f_LR, [512, False, 32]], # 14 P4 feature → 256ch

    [[11, 14], 1, Detect, [nc, anchors]], # Detect(P3=128ch, P4=256ch)
  ]
